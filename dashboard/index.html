<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%sentinelx-mark-v1-32.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%sentinelx-mark-v1.svg" />
    <title>SentinelX — Giám Sát Hạ Tầng & Bảo Vệ Tự Động</title>
    <script>
      // Thiết lập tiêu đề trang SentinelX ngay khi bắt đầu nạp DOM
      document.title = "SentinelX — Giám Sát Hạ Tầng & Bảo Vệ Tự Động";

      // Tự động dọn dẹp các Service Worker còn sót lại trên localhost:5174 từ các dự án trước
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        });
      }

      // Tự động dọn dẹp CacheStorage cũ của localhost:5174
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var k of keys) {
            caches.delete(k);
          }
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
