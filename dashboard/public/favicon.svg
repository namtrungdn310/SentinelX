<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="shieldBorder" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Sentinel X Beam Gradient -->
    <linearGradient id="xBeam1" x1="18" y1="20" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="xBeam2" x1="46" y1="20" x2="18" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Base Geometry -->
  <path
    d="M32 3.5 L55 14 C55 14 55.5 37 32 60.5 C8.5 37 9 14 9 14 L32 3.5 Z"
    fill="url(#shieldBg)"
    stroke="url(#shieldBorder)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Accent Line -->
  <path
    d="M32 8 L50 17 C50 17 50.5 35 32 54 C13.5 35 14 17 14 17 L32 8 Z"
    fill="none"
    stroke="#38bdf8"
    stroke-width="1"
    stroke-opacity="0.35"
    stroke-linejoin="round"
  />

  <!-- Radar Grid Arc -->
  <circle cx="32" cy="32" r="13" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.5" />

  <!-- Sentinel Cross / "X" Wings -->
  <path
    d="M21 21 L43 43"
    stroke="url(#xBeam1)"
    stroke-width="5.2"
    stroke-linecap="round"
  />
  <path
    d="M43 21 L21 43"
    stroke="url(#xBeam2)"
    stroke-width="5.2"
    stroke-linecap="round"
  />

  <!-- Central Sentinel Radar Core -->
  <circle cx="32" cy="32" r="4.2" fill="#090d16" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="32" cy="32" r="2" fill="#22d3ee" filter="url(#glow)" />

  <!-- Top Active Status Node -->
  <circle cx="32" cy="13.5" r="1.8" fill="#38bdf8" />
</svg>