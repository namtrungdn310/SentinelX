name: sentinelx

# ==============================================================================
# SentinelX — Docker Compose Lab Environment
# Level-1 Full-Stack Deployment & PBL4 Multi-Node Simulation
#
# Profiles available:
#   1. core   -> PostgreSQL + Controller + Dashboard
#   2. lab    -> core + Load Balancer + 2 Backend Nodes + 2 Real Agents
#   3. attack -> lab + Traffic Generator / Attack Simulator
# ==============================================================================

networks:
  sentinelx_public:
    name: sentinelx_public
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.1.0/24

  sentinelx_internal:
    name: sentinelx_internal
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.2.0/24

volumes:
  sentinelx_pgdata:
    name: sentinelx_pgdata
  agent01_identity:
  agent02_identity:

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Core Database
  # ----------------------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: sentinelx_postgres
    restart: unless-stopped
    profiles: [core, lab, attack]
    environment:
      POSTGRES_USER: ${SENTINELX_DB_USER:-sentinelx}
      POSTGRES_PASSWORD: ${SENTINELX_DB_PASSWORD:-sentinelx_password}
      POSTGRES_DB: ${SENTINELX_DB_NAME:-sentinelx}
    volumes:
      - sentinelx_pgdata:/var/lib/postgresql/data
    networks:
      sentinelx_internal:
        ipv4_address: 172.28.2.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SENTINELX_DB_USER:-sentinelx} -d ${SENTINELX_DB_NAME:-sentinelx}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. SentinelX Central Controller (FastAPI Modular Monolith)
  # ----------------------------------------------------------------------------
  sentinelx_controller:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.controller
    image: sentinelx-controller:latest
    container_name: sentinelx_controller
    restart: unless-stopped
    profiles: [core, lab, attack]
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "${SENTINELX_CONTROLLER_PORT:-8000}:8000"
    environment:
      SENTINELX_ENVIRONMENT: ${SENTINELX_ENV:-development}
      SENTINELX_SERVER__HOST: 0.0.0.0
      SENTINELX_SERVER__PORT: 8000
      SENTINELX_DATABASE__URL: postgresql+asyncpg://${SENTINELX_DB_USER:-sentinelx}:${SENTINELX_DB_PASSWORD:-sentinelx_password}@postgres_db:5432/${SENTINELX_DB_NAME:-sentinelx}
      SENTINELX_LOGGING__LEVEL: ${SENTINELX_LOG_LEVEL:-INFO}
      SENTINELX_LOGGING__JSON_FORMAT: "true"
      SENTINELX_LB_ADMIN_TOKEN: ${SENTINELX_LB_ADMIN_TOKEN:-sentinelx_dev_lb_token}
      SENTINELX_DEFAULT_LB_URL: ${SENTINELX_DEFAULT_LB_URL:-http://sentinelx_lb:8080}
      SENTINELX_SAFETY__PROTECTED_CIDRS: '["172.28.2.10/32","172.28.2.20/32","172.28.2.25/32","172.28.1.100/32"]'
    networks:
      sentinelx_public:
      sentinelx_internal:
        ipv4_address: 172.28.2.20

  # ----------------------------------------------------------------------------
  # 3. SentinelX Dashboard Web UI (React + Vite SPA behind Nginx proxy)
  # ----------------------------------------------------------------------------
  sentinelx_dashboard:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.dashboard
    image: sentinelx-dashboard:latest
    container_name: sentinelx_dashboard
    restart: unless-stopped
    profiles: [core, lab, attack]
    depends_on:
      sentinelx_controller:
        condition: service_healthy
    ports:
      - "${SENTINELX_DASHBOARD_PORT:-5174}:80"
    environment:
      SENTINELX_CONTROLLER_UPSTREAM: sentinelx_controller:8000
    networks:
      sentinelx_public:
      sentinelx_internal:

  # ----------------------------------------------------------------------------
  # 4. SentinelX Custom HTTP Load Balancer (aiohttp Reverse Proxy)
  # ----------------------------------------------------------------------------
  sentinelx_lb:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.lb
    image: sentinelx-lb:latest
    container_name: sentinelx_lb
    restart: unless-stopped
    profiles: [lab, attack]
    depends_on:
      backend01:
        condition: service_started
      backend02:
        condition: service_started
    ports:
      - "${SENTINELX_LB_PORT:-8080}:8080"
    environment:
      SENTINELX_LB_HOST: 0.0.0.0
      SENTINELX_LB_PORT: 8080
      SENTINELX_LB_BACKENDS: "http://172.28.2.31:8080,http://172.28.2.32:8080"
      SENTINELX_LB_ALGORITHM: round_robin
      SENTINELX_LB_HEALTH_CHECK__ENABLED: "true"
      SENTINELX_LB_HEALTH_CHECK__PATH: "/health"
      SENTINELX_LB_HEALTH_CHECK__INTERVAL_SECONDS: "3.0"
      SENTINELX_LB_ADMIN_TOKEN: ${SENTINELX_LB_ADMIN_TOKEN:-sentinelx_dev_lb_token}
    networks:
      sentinelx_public:
        ipv4_address: 172.28.1.100
      sentinelx_internal:
        ipv4_address: 172.28.2.25

  # ----------------------------------------------------------------------------
  # 5. Backend Workload Nodes (Node A & Node B)
  # ----------------------------------------------------------------------------
  backend01:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    image: sentinelx-backend:latest
    container_name: sentinelx_backend01
    restart: unless-stopped
    profiles: [lab, attack]
    environment:
      NODE_NAME: backend01
      PORT: 8080
    networks:
      sentinelx_internal:
        ipv4_address: 172.28.2.31

  backend02:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    image: sentinelx-backend:latest
    container_name: sentinelx_backend02
    restart: unless-stopped
    profiles: [lab, attack]
    environment:
      NODE_NAME: backend02
      PORT: 8080
    networks:
      sentinelx_internal:
        ipv4_address: 172.28.2.32

  # ----------------------------------------------------------------------------
  # 6. SentinelX Agents (Node A & Node B Daemons)
  # ----------------------------------------------------------------------------
  agent01:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent
    image: sentinelx-agent:latest
    container_name: sentinelx_agent01
    restart: unless-stopped
    profiles: [lab, attack]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP]
    volumes: [agent01_identity:/var/lib/sentinelx-agent]
    network_mode: service:backend01
    depends_on:
      sentinelx_controller:
        condition: service_healthy
      backend01:
        condition: service_started
    environment:
      SENTINELX_LAB_BOOTSTRAP: "1"
      SENTINELX_LAB_NODE_IP: 172.28.2.31
      SENTINELX_LAB_LB_ROLE: lb_backend
      SENTINELX_LAB_LB_PORT: "8080"
      SENTINELX_LAB_LB_HEALTH_PATH: /health
      SENTINELX_LAB_ENABLE_PROJECT_LB: "1"
      SENTINELX_HOSTNAME: backend01
      SENTINELX_CONTROLLER_URL: http://172.28.2.20:8000
      SENTINELX_HEARTBEAT_INTERVAL_SECONDS: 5
      SENTINELX_TELEMETRY_INTERVAL_SECONDS: 5
      SENTINELX_TELEMETRY_BATCH_SIZE: 2
      SENTINELX_DEFENSE_EXECUTOR_TYPE: ${SENTINELX_LAB_EXECUTOR:-nftables}
      SENTINELX_NETWORK_CAPTURE_ENABLED: ${SENTINELX_LAB_CAPTURE:-true}
      SENTINELX_NETWORK_INTERFACE: ${SENTINELX_LAB_NET_IFACE:-eth0}
      SENTINELX_PROTECTED_CIDRS: '["172.28.2.20/32","172.28.1.100/32","172.28.2.25/32"]'

  agent02:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent
    image: sentinelx-agent:latest
    container_name: sentinelx_agent02
    restart: unless-stopped
    profiles: [lab, attack]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP]
    volumes: [agent02_identity:/var/lib/sentinelx-agent]
    network_mode: service:backend02
    depends_on:
      sentinelx_controller:
        condition: service_healthy
      backend02:
        condition: service_started
    environment:
      SENTINELX_LAB_BOOTSTRAP: "1"
      SENTINELX_LAB_NODE_IP: 172.28.2.32
      SENTINELX_LAB_LB_ROLE: lb_backend
      SENTINELX_LAB_LB_PORT: "8080"
      SENTINELX_LAB_LB_HEALTH_PATH: /health
      SENTINELX_LAB_ENABLE_PROJECT_LB: "1"
      SENTINELX_HOSTNAME: backend02
      SENTINELX_CONTROLLER_URL: http://172.28.2.20:8000
      SENTINELX_HEARTBEAT_INTERVAL_SECONDS: 5
      SENTINELX_TELEMETRY_INTERVAL_SECONDS: 5
      SENTINELX_TELEMETRY_BATCH_SIZE: 2
      SENTINELX_DEFENSE_EXECUTOR_TYPE: ${SENTINELX_LAB_EXECUTOR:-nftables}
      SENTINELX_NETWORK_CAPTURE_ENABLED: ${SENTINELX_LAB_CAPTURE:-true}
      SENTINELX_NETWORK_INTERFACE: ${SENTINELX_LAB_NET_IFACE:-eth0}
      SENTINELX_PROTECTED_CIDRS: '["172.28.2.20/32","172.28.1.100/32","172.28.2.25/32"]'

  # ----------------------------------------------------------------------------
  # 7. Attacker & Traffic Generator
  # ----------------------------------------------------------------------------
  traffic_sim:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.attacker
    image: sentinelx-attacker:latest
    container_name: sentinelx_attacker
    profiles: [attack]
    depends_on:
      - sentinelx_lb
      - backend01
    networks:
      sentinelx_public:
        ipv4_address: 172.28.1.200
      sentinelx_internal:
        ipv4_address: 172.28.2.200
