# SentinelX Load Balancer Configuration Template (Multi-Host Ready)
host: "0.0.0.0"
port: 8080

algorithm: "round_robin"  # Options: round_robin, least_in_flight

health_check:
  enabled: true
  path: "/health"
  interval_seconds: 2.0
  timeout_seconds: 1.0
  failure_threshold: 3
  success_threshold: 2

# Upstream Backend Pool (Configurable for LAN IP or Docker service names)
backends:
  - url: "http://10.0.1.20:8080"
    weight: 1
    name: "backend01"
    health_path: "/health"
  - url: "http://10.0.1.21:8080"
    weight: 1
    name: "backend02"
    health_path: "/health"

client_timeout_seconds: 30.0
log_level: "INFO"
