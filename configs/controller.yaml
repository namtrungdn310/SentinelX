# Settings for SentinelX Controller
environment: development
service_name: sentinelx-controller
version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  json_format: true

database:
  url: "postgresql+asyncpg://sentinelx:sentinelx_password@localhost:5432/sentinelx"
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30.0
  echo: false

# M3: consecutive observations must be fresh and close enough in time.
detection:
  window_size: 10
  cooldown_seconds: 60
  max_gap_seconds: 60
  max_sample_age_seconds: 86400
  future_skew_seconds: 30
