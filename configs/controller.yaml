# Settings for SentinelX Controller
environment: development
service_name: sentinelx-controller
version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  json_format: true

database:
  url: "postgresql+asyncpg://sentinelx:sentinelx_password@localhost:5432/sentinelx"
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30.0
  echo: false
