# Settings for SentinelX Controller
environment: development
service_name: sentinelx-controller
version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  json_format: true

database:
  url: "postgresql+asyncpg://sentinelx:sentinelx_password@localhost:5432/sentinelx"
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30.0
  echo: false

# M3: consecutive observations must be fresh and close enough in time.
detection:
  window_size: 10
  cooldown_seconds: 60
  max_gap_seconds: 60
  max_sample_age_seconds: 86400
  future_skew_seconds: 30
safety:
  protected_cidrs: []
  command_ttl_seconds: 300
  command_lease_seconds: 30
  command_max_attempts: 5
  recovery_max_attempts: 3
  recovery_backoff_seconds: 30
  recovery_quiet_seconds: 120

retention:
  metric_days: 7
  network_days: 3
  policy_audit_days: 90
  batch_size: 1000
